name: Android CI
run-name: ${{ github.event.head_commit.message || github.workflow }}

on:
  push:
    branches: [ "main", "Final", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-checks:
    name: Debug build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run debug build, lint and unit tests
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Room database instrumented tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon connectedDebugAndroidTest

  release:
    name: Build signed release APK
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Final')) || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; release signing is required."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medical-rep-manager.jks"
          test -s "$RUNNER_TEMP/medical-rep-manager.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/medical-rep-manager.jks" >> "$GITHUB_ENV"
          echo "Stable Android signing key restored."

      - name: Verify stable signing key
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "::error::Signing keystore is missing."; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is missing."; exit 1; }
          KEYTOOL_OUTPUT="$RUNNER_TEMP/keystore-info.txt"
          if ! keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" > "$KEYTOOL_OUTPUT" 2>&1; then
            echo "::error::Could not read the signing keystore. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            cat "$KEYTOOL_OUTPUT"
            exit 1
          fi
          if ! grep -Ei "SHA1:|SHA-1:" "$KEYTOOL_OUTPUT"; then
            echo "::error::Keystore opened, but SHA-1 fingerprint was not found. Keytool output:"
            cat "$KEYTOOL_OUTPUT"
            exit 1
          fi
          echo "Stable signing key verification passed."

      - name: Build signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-rep-manager-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
