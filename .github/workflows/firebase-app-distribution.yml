name: Build and Distribute Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose where this build should be published"
        required: true
        default: tester
        type: choice
        options:
          - tester
          - final
      version_name:
        description: "App version name (for example 1.2.0)"
        required: true
        default: "0.1.1"
        type: string
      release_notes:
        description: "Release notes / tester notes"
        required: false
        default: "Bug fixes and improvements"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medical-rep-manager.jks"
          test -s "$RUNNER_TEMP/medical-rep-manager.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/medical-rep-manager.jks" >> "$GITHUB_ENV"

      - name: Verify stable signing key
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "::error::Signing keystore is missing."; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is missing."; exit 1; }
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-info.txt"
          grep -Ei "SHA1:|SHA-1:" "$RUNNER_TEMP/keystore-info.txt"
          echo "Stable signing key verification passed."

      - name: Validate release version and tag
        if: inputs.build_type == 'final'
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 0.3 or 1.2.3 (optional prerelease suffix allowed)."
            exit 1
          fi
          TAG="v$VERSION_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Use a new version name."
            exit 1
          fi

      - name: Run release lint and unit tests
        run: gradle --no-daemon lintRelease testReleaseUnitTest

      - name: Build signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon assembleRelease

      - name: Verify and prepare APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null

          AAPT="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::aapt was not found in Android SDK build-tools."
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK_PATH")"
          echo "$BADGING" | grep -F "versionCode='$GITHUB_RUN_NUMBER' versionName='$VERSION_NAME'" >/dev/null || {
            echo "::error::APK version metadata does not match the requested version."
            echo "$BADGING" | grep '^package:'
            exit 1
          }

          mkdir -p dist
          cp "$APK_PATH" "dist/MRM-$VERSION_NAME.apk"
          echo "APK_PATH=dist/MRM-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Distribute to Firebase tester group
        if: inputs.build_type == 'tester'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUP: ${{ secrets.FIREBASE_GROUP }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing."; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo "::error::FIREBASE_APP_ID secret is missing."; exit 1; }
          test -n "$FIREBASE_GROUP" || { echo "::error::FIREBASE_GROUP secret is missing."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          jq -e '.client_email and .private_key and .project_id' "$RUNNER_TEMP/firebase-service-account.json" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          npm install --global firebase-tools@14.12.0
          firebase --version
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUP" \
            --release-notes "$RELEASE_NOTES" \
            --non-interactive

      - name: Create update manifest
        if: inputs.build_type == 'final'
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="v$VERSION_NAME"
          APK_NAME="$(basename "$APK_PATH")"
          DOWNLOAD_URL="https://github.com/$REPOSITORY/releases/download/$TAG/$APK_NAME"
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "$DOWNLOAD_URL" \
            --arg notes "$RELEASE_NOTES" \
            '{versionName:$versionName,versionCode:$versionCode,apkUrl:$apkUrl,releaseNotes:$notes}' \
            > dist/latest.json

          jq -e --arg name "$VERSION_NAME" --argjson code "$VERSION_CODE" \
            '.versionName == $name and .versionCode == $code and (.apkUrl | type == "string" and length > 0)' \
            dist/latest.json >/dev/null

      - name: Publish GitHub Release
        if: inputs.build_type == 'final'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Medical Rep Manager v${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          files: |
            dist/MRM-${{ inputs.version_name }}.apk
            dist/latest.json
          draft: false
          prerelease: false
