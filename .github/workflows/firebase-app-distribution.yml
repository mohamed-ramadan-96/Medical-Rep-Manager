name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: "New test build"
        type: string

permissions:
  contents: read

jobs:
  distribute:
    name: Build and distribute signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medical-rep-manager.jks"
          test -s "$RUNNER_TEMP/medical-rep-manager.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/medical-rep-manager.jks" >> "$GITHUB_ENV"

      - name: Verify stable signing key
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "::error::Signing keystore is missing."; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is missing."; exit 1; }
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-info.txt"
          grep -Ei "SHA1:|SHA-1:" "$RUNNER_TEMP/keystore-info.txt"
          echo "Stable signing key verification passed."

      - name: Build release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          apksigner verify --verbose "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          jq -e '.client_email and .private_key and .project_id' "$RUNNER_TEMP/firebase-service-account.json" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Distribute to tester group
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUP: ${{ secrets.FIREBASE_GROUP }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$FIREBASE_APP_ID" || { echo "::error::FIREBASE_APP_ID secret is missing."; exit 1; }
          test -n "$FIREBASE_GROUP" || { echo "::error::FIREBASE_GROUP secret is missing."; exit 1; }
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUP" \
            --release-notes "$RELEASE_NOTES" \
            --non-interactive
