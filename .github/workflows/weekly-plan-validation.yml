name: Weekly Plan Validation

on:
  push:
    branches: [ "feature/weekly-plan-final" ]

permissions:
  contents: read

jobs:
  build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and compile debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
